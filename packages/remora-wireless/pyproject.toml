[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "remora-wireless"
version = "0.1.0"
description = "Wireless-protocol tables for remora (wlan, radiotap, …)"
requires-python = ">=3.10"
authors = [{ name = "Ruoshi Li", email = "iceboundrock@gmail.com" }]
dependencies = ["remora==0.1.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/remora"]

[tool.hatch.build.targets.sdist]
include = ["src/remora"]

[tool.uv.sources]
remora = { workspace = true }
