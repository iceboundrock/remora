[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "remora"
version = "0.1.0"
description = "A type-safe, IDE-friendly Python DSL for Wireshark/tshark capture analysis"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Ruoshi Li", email = "iceboundrock@gmail.com" }]
# remora.codegen reads codegen.toml; tomllib is only stdlib from 3.11 on.
dependencies = ["tomli>=2.0; python_version < '3.11'"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Networking :: Monitoring",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/iceboundrock/remora"
Issues = "https://github.com/iceboundrock/remora/issues"

[project.optional-dependencies]
wireless = ["remora-wireless==0.1.0"]
industrial = ["remora-industrial==0.1.0"]
telecom = ["remora-telecom==0.1.0"]
# DuckDB workspace (M4). Core stays dependency-free for tshark-only users.
workspace = ["duckdb>=1.1"]
# "all" means everything: every protocol extra plus the workspace. Keep it the
# exact union of the extras above — tests/test_packaging.py enforces that.
all = [
    "remora-wireless==0.1.0",
    "remora-industrial==0.1.0",
    "remora-telecom==0.1.0",
    "duckdb>=1.1",
]

[project.scripts]
psdsl = "remora.codegen.cli:main"

[dependency-groups]
dev = [
    "duckdb>=1.1",
    "mypy>=1.14",
    "pytest>=8.0",
    "ruff>=0.16.2",
    "tomli>=2.0",
    "typing-extensions>=4.4",
    "remora-wireless",
    "remora-industrial",
    "remora-telecom",
]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
remora-wireless = { workspace = true }
remora-industrial = { workspace = true }
remora-telecom = { workspace = true }

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
    "D",   # pydocstyle — public API docstrings (issue #24)
]
# D105/D107: magic methods and __init__ are documented at class level.
ignore = ["D105", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Generated protocol tables (issue #19) keep one field entry per line no
# matter how long the abbrev is; the emitter never wraps (see the line-length
# note in src/remora/codegen/emit.py).
"src/remora/proto/*" = ["E501", "D"]
"packages/*/src/remora/proto/*" = ["E501", "D"]
# Docstring enforcement targets the public API; tests and CI scripts are exempt.
"tests/*" = ["D"]
".github/scripts/*" = ["D"]

[tool.ruff.format]
# Generated protocol modules are byte-exact emitter output; reformatting them
# would break `python -m remora.codegen check`. _meta.py and __init__.py ride
# along (they remain lint-checked apart from E501; only the formatter skips them).
exclude = [
    "src/remora/proto/*.py",
    "src/remora/proto/*.pyi",
    "packages/*/src/remora/proto/*.py",
    "packages/*/src/remora/proto/*.pyi",
]

[tool.mypy]
strict = true
python_version = "3.10"
mypy_path = "src"
packages = ["remora"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "integration: requires a real tshark binary (deselect with '-m \"not integration\"')",
]
