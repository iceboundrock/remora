[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "remora"
version = "0.1.0"
description = "A type-safe, IDE-friendly Python DSL for Wireshark/tshark capture analysis"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Ruoshi Li", email = "iceboundrock@gmail.com" }]
# remora.codegen reads codegen.toml; tomllib is only stdlib from 3.11 on.
dependencies = ["tomli>=2.0; python_version < '3.11'"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Networking :: Monitoring",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/iceboundrock/remora"
Issues = "https://github.com/iceboundrock/remora/issues"

[project.scripts]
psdsl = "remora.codegen.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.14",
    "pytest>=8.0",
    "ruff>=0.9",
    "tomli>=2.0",
    "typing-extensions>=4.4",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]

[tool.mypy]
strict = true
python_version = "3.10"
mypy_path = "src"
packages = ["remora"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "integration: requires a real tshark binary (deselect with '-m \"not integration\"')",
]
