name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: uv sync
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Typecheck
        run: uv run mypy --strict src tests
      # The editable half of #77's two-layout coverage. `uv sync` installs the
      # extras as separate editable roots, so mypy finds `remora.proto.wlan`
      # under `packages/remora-wireless/src/remora/` and needs a `py.typed`
      # *there* — core's marker covers the extras only in a wheel install,
      # where every distribution unpacks into one `site-packages/remora/`. The
      # `wheels` job runs this same script against that layout. --python-version
      # 3.12 selects typeshed semantics only (for `typing.assert_type`), so this
      # runs unchanged on every interpreter in the matrix.
      - name: Extras stubs resolve in the editable workspace
        run: uv run mypy --strict --python-version 3.12 .github/scripts/check_stub_resolution.py
      - name: Install tshark
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y tshark
          tshark --version | head -n 1
      - name: Test
        run: uv run pytest
        env:
          # Both guards turn "dependency missing" from a clean local skip into a
          # hard failure here, so a broken install can never silently skip the
          # integration suites. duckdb needs no install step of its own — it is
          # in the dev dependency group, so the `uv sync` above already has it.
          REMORA_REQUIRE_TSHARK: "1"
          REMORA_REQUIRE_DUCKDB: "1"

  # The `checks` legs above install Ubuntu's stock tshark (4.2.2 on noble),
  # which does NOT double backslashes in `-T fields` values — so the reader
  # refuses to unescape there and every control-character assertion takes the
  # divergence-pinning branch. Without this job the >= 4.4 unescape path, which
  # is the actual fix in #74, would never meet a real tshark anywhere in CI.
  # One Python version is enough: what varies here is the tshark build.
  tshark-ppa:
    name: tests against pinned tshark (>= 4.4 unescape path)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync
      - name: Install pinned tshark (ppa:wireshark-dev/stable)
        run: |
          sudo add-apt-repository -y ppa:wireshark-dev/stable
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y tshark
          tshark --version | head -n 1
      # The whole suite, not just `-m integration`: the same command the
      # `checks` leg runs, so the two differ in exactly one variable — the
      # tshark build — and no marker drift can quietly drop a live-tshark
      # test out of this leg's coverage.
      - name: Test
        run: uv run pytest
        env:
          REMORA_REQUIRE_TSHARK: "1"
          REMORA_REQUIRE_DUCKDB: "1"

  codegen-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync
      - name: Install pinned tshark (ppa:wireshark-dev/stable)
        run: |
          sudo add-apt-repository -y ppa:wireshark-dev/stable
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y tshark
          tshark --version | head -n 1
      - name: Check generated-artifact drift
        run: uv run python -m remora.codegen check

  wheels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.12"
      - name: Build all distributions
        run: |
          uv build --out-dir dist
          uv build --out-dir dist packages/remora-wireless
          uv build --out-dir dist packages/remora-industrial
          uv build --out-dir dist packages/remora-telecom
      - name: Spot-check wheel contents
        run: uv run --no-project --python 3.12 .github/scripts/check_wheel_contents.py
      - name: Core-only install refuses extras protocols helpfully
        run: |
          uv venv --python 3.12 core-env
          uv pip install --python core-env/bin/python dist/remora-*.whl
          core-env/bin/python -c "
          from remora.proto import TCP
          try:
              from remora.proto import WLAN
          except ImportError as error:
              assert \"pip install 'remora[wireless]'\" in str(error), error
              print('core-only ImportError OK:', error)
          else:
              raise SystemExit('expected an ImportError for WLAN')
          "
      - name: remora[all] resolves every extra
        # find-links (not --no-index) because "all" includes the third-party
        # extras — workspace's duckdb and arrow's pyarrow — which live on PyPI,
        # not in dist/. The unpublished remora-* dists still resolve from dist/
        # — no index carries them — so this keeps testing the locally built
        # wheels.
        run: |
          uv venv --python 3.12 all-env
          uv pip install --python all-env/bin/python --find-links dist "remora[all]"
          all-env/bin/python -c "
          import duckdb, pyarrow
          from remora.proto import WLAN, RADIOTAP, MODBUS, MBTCP, DNP3, GTP, DIAMETER
          print('extras resolve OK; duckdb', duckdb.__version__, 'pyarrow', pyarrow.__version__)
          "
      # The wheel half of #77's two-layout coverage: here every distribution has
      # unpacked into one site-packages/remora/, so this passes on core's marker
      # alone. The `checks` job runs the same script in the editable workspace,
      # which is the layout that needs each extra's own remora/py.typed.
      - name: Extras stubs resolve for mypy
        run: |
          uv pip install --python all-env/bin/python mypy
          all-env/bin/python -m mypy --strict --python-version 3.12 .github/scripts/check_stub_resolution.py
