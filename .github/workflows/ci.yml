name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: uv sync
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Typecheck
        run: uv run mypy --strict src tests
      - name: Install tshark
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y tshark
          tshark --version | head -n 1
      - name: Test
        run: uv run pytest
        env:
          REMORA_REQUIRE_TSHARK: "1"

  codegen-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.0
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync
      - name: Install pinned tshark (ppa:wireshark-dev/stable)
        run: |
          sudo add-apt-repository -y ppa:wireshark-dev/stable
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y tshark
          tshark --version | head -n 1
      - name: Check generated-artifact drift
        run: uv run python -m remora.codegen check

  wheels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.0
        with:
          python-version: "3.12"
      - name: Build all distributions
        run: |
          uv build --out-dir dist
          uv build --out-dir dist packages/remora-wireless
          uv build --out-dir dist packages/remora-industrial
          uv build --out-dir dist packages/remora-telecom
      - name: Spot-check wheel contents
        run: uv run --no-project --python 3.12 .github/scripts/check_wheel_contents.py
      - name: Core-only install refuses extras protocols helpfully
        run: |
          uv venv --python 3.12 core-env
          uv pip install --python core-env/bin/python dist/remora-*.whl
          core-env/bin/python -c "
          from remora.proto import TCP
          try:
              from remora.proto import WLAN
          except ImportError as error:
              assert \"pip install 'remora[wireless]'\" in str(error), error
              print('core-only ImportError OK:', error)
          else:
              raise SystemExit('expected an ImportError for WLAN')
          "
      - name: remora[all] resolves every extra
        # find-links (not --no-index) because "all" now includes the workspace
        # extra, whose duckdb dependency lives on PyPI, not in dist/. The
        # unpublished remora-* dists still resolve from dist/ — no index carries
        # them — so this keeps testing the locally built wheels.
        run: |
          uv venv --python 3.12 all-env
          uv pip install --python all-env/bin/python --find-links dist "remora[all]"
          all-env/bin/python -c "
          import duckdb
          from remora.proto import WLAN, RADIOTAP, MODBUS, MBTCP, DNP3, GTP, DIAMETER
          print('extras resolve OK; duckdb', duckdb.__version__)
          "
      - name: Extras stubs resolve for mypy
        run: |
          uv pip install --python all-env/bin/python mypy
          all-env/bin/python -m mypy --strict --python-version 3.12 .github/scripts/check_stub_resolution.py
